# Paso 2 — HTTPS (activar después de obtener el certificado SSL)
# Copiar este archivo sobre default.conf y recargar nginx:
#   cp nginx/default.ssl.conf nginx/default.conf
#   docker compose -f docker-compose.prod.yml exec nginx nginx -s reload

server {
    listen 80;
    server_name backend.jocoso.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name backend.jocoso.cl;

    ssl_certificate     /etc/letsencrypt/live/backend.jocoso.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.jocoso.cl/privkey.pem;

    # Seguridad TLS
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
